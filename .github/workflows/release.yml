name: release

# Push a tag such as v1.0.0 to build the image and publish it to ghcr.io and, when the two repository
# secrets below exist, to Docker Hub as <DOCKERHUB_USERNAME>/fyta-exporter.
#   gh secret set DOCKERHUB_USERNAME     (your Docker Hub user name)
#   gh secret set DOCKERHUB_TOKEN        (an access token from hub.docker.com -> Account settings -> Security)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: List the image tags
        id: tags
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${REPO}:${VERSION}"
            echo "ghcr.io/${REPO}:latest"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "${DOCKERHUB_USERNAME}/fyta-exporter:${VERSION}"
              echo "${DOCKERHUB_USERNAME}/fyta-exporter:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # No QEMU step: the Dockerfile has no RUN instruction, so nothing runs on the arm64 side.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
